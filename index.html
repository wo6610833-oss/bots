<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Боты для бизнеса · Буэнос-Айрес</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg0:#0F1B33; --bg1:#1B2A4A; --bg2:#22355E;
  --card:rgba(255,255,255,.05); --line:rgba(255,255,255,.10);
  --tx:#F3F6FC; --mut:#AEBBD6; --dim:#7F8FB0;
  --mint:#5ED6A4; --mintD:#3FBF8B; --ink:#0F1B33; --red:#FF8A8A;
  --r:18px; --pad:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg0);color:var(--tx);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1200px 600px at 50% -200px,#2E457A 0%,var(--bg1) 45%,var(--bg0) 100%) fixed;
  padding-bottom:calc(96px + env(safe-area-inset-bottom))}
a{color:var(--mint)}
button{font:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 var(--pad)}
h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.01em}
h1{font-size:30px;font-weight:800} h2{font-size:22px;font-weight:800;margin-bottom:6px} p{margin:0}
.mut{color:var(--mut)} .dim{color:var(--dim)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--mint);text-transform:uppercase}
.sec{padding:34px 0 6px} .sec > .sub{color:var(--mut);margin-top:6px}
.hidden{display:none!important}

.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800}
.brand .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#2E457A,#1B2A4A);display:grid;place-items:center;border:1px solid var(--line)}
.lang{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;color:var(--mut);font-weight:700;padding:6px 12px;border-radius:999px;font-size:13px}
.lang button.on{background:var(--mint);color:var(--ink)}

.hero{padding:22px 0 8px} .hero h1{margin:10px 0 12px} .hero .sub{font-size:17px;color:var(--mut)}
.hero-chat{margin:22px 0 4px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.hero-chat .t{font-size:12px;color:var(--dim);margin-bottom:8px;display:flex;justify-content:space-between}
.bub{max-width:82%;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.35;white-space:pre-line}
.bub.in{background:#2A3C63;border-bottom-left-radius:6px}
.bub.out{background:#2A3C63;margin-left:auto;border-bottom-right-radius:6px}
.hero-chat .bub + .bub{margin-top:8px}
.hero-chat .bub.in{background:rgba(94,214,164,.16);border:1px solid rgba(94,214,164,.35)}
.hero-chat .seen{font-size:12px;color:var(--dim);text-align:right;margin-top:6px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:rgba(94,214,164,.14);color:var(--mint);border:1px solid rgba(94,214,164,.35)}
.badge .dot{width:7px;height:7px;border-radius:50%;background:var(--mint);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(94,214,164,.55)}100%{box-shadow:0 0 0 10px rgba(94,214,164,0)}}
.btn{display:block;width:100%;border:0;background:var(--mint);color:var(--ink);font-weight:800;font-size:16px;padding:15px;border-radius:14px;box-shadow:0 10px 30px rgba(94,214,164,.25);margin-top:16px}
.btn.ghost{background:var(--card);color:var(--tx);border:1px solid var(--line);box-shadow:none}
.btn.sm{padding:12px;font-size:15px;margin-top:10px}

/* quiz */
.quiz{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;margin-top:14px}
.prog{height:6px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:var(--mint);transition:.3s;width:0}
.quiz .qn{font-size:12px;color:var(--dim);font-weight:700;margin-bottom:4px}
.quiz h3{font-size:19px;margin-bottom:12px}
.opts{display:grid;gap:8px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--tx);border-radius:14px;padding:13px 14px;text-align:left;font-weight:600;font-size:15px;transition:.15s}
.opt.on{border-color:var(--mint);background:rgba(94,214,164,.14);box-shadow:inset 0 0 0 1px var(--mint)}
.qnav{display:flex;gap:8px;margin-top:12px}
.qnav button{flex:1}
.qnav .back{flex:0 0 auto;padding:12px 16px}

/* result */
.result{background:linear-gradient(180deg,rgba(94,214,164,.12),rgba(94,214,164,.03));border:1px solid rgba(94,214,164,.45);border-radius:var(--r);padding:18px 16px;margin-top:14px}
.result .meta{font-size:13.5px;color:var(--mut);margin:6px 0 12px}
.result .txt{font-size:15px;margin-bottom:12px}
.result ol{margin:6px 0 12px;padding-left:22px} .result li{margin:3px 0}
.result .loss{background:rgba(0,0,0,.25);border-radius:14px;padding:12px 14px;font-size:14.5px}
.result .loss b{color:var(--red)}
.three{display:grid;gap:8px;margin-top:14px}
.three .btn{margin-top:0}

/* niches */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:transparent;color:var(--mut);padding:8px 12px;border-radius:999px;font-weight:600;font-size:13.5px}
.chips button.on{background:var(--mint);color:var(--ink);border-color:var(--mint)}

/* phone demo */
.phone{margin-top:16px;background:#0B1426;border:1px solid var(--line);border-radius:26px;padding:10px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.ph-top{display:flex;align-items:center;gap:10px;padding:8px 8px 10px;border-bottom:1px solid var(--line)}
.ph-top .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#2E457A,#1B2A4A);display:grid;place-items:center;border:1px solid var(--line)}
.ph-top .nm{font-weight:700;font-size:15px} .ph-top .st{font-size:12px;color:var(--mint)}
.ph-body{height:380px;overflow-y:auto;padding:12px 6px 6px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}
.ph-body .bub{font-size:14.5px} .ph-body .bub.in{background:#1E2F52}
.ph-body .bub.out{background:var(--mint);color:var(--ink);font-weight:600}
.kb{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 4px 0;max-width:92%}
.kb button{border:1px solid rgba(94,214,164,.5);background:rgba(94,214,164,.10);color:var(--tx);border-radius:12px;padding:8px 11px;font-size:13.5px;font-weight:600}
.kb.done button{opacity:.45;pointer-events:none}
.kb.done button.pick{opacity:1;background:var(--mint);color:var(--ink);border-color:var(--mint)}
.typing{display:inline-flex;gap:4px;padding:11px 14px;background:#1E2F52;border-radius:16px;border-bottom-left-radius:6px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--mut);animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.ph-foot{display:flex;gap:8px;padding:8px 4px 2px}
.ph-foot .inp{flex:1;background:#132040;border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-size:14px;color:var(--dim)}
.owner-note{margin-top:12px;background:rgba(94,214,164,.08);border:1px solid rgba(94,214,164,.3);border-radius:14px;padding:12px 14px;font-size:14px;display:none;white-space:pre-line}
.owner-note b{color:var(--mint)}

/* calc */
.calc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;margin-top:14px}
.row{margin-bottom:16px}
.row .lab{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);margin-bottom:6px}
.row .lab b{color:var(--tx);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;appearance:none;height:6px;border-radius:999px;background:linear-gradient(90deg,var(--mint) var(--p,50%),rgba(255,255,255,.14) var(--p,50%));outline:none}
input[type=range]::-webkit-slider-thumb{appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--mint);box-shadow:0 2px 10px rgba(0,0,0,.4)}
.cur{display:flex;gap:6px;margin-bottom:14px}
.cur button{border:1px solid var(--line);background:transparent;color:var(--mut);padding:6px 12px;border-radius:999px;font-weight:700;font-size:13px}
.cur button.on{background:var(--mint);color:var(--ink);border-color:var(--mint)}
.res{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.res .box{background:rgba(0,0,0,.25);border-radius:14px;padding:12px}
.res .k{font-size:12px;color:var(--dim)} .res .v{font-size:21px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.res .v small{font-size:12px;font-weight:700;color:var(--mut);margin-left:3px}
.res .v.red{color:var(--red)}
.calc .note{margin-top:12px;font-size:13.5px;color:var(--mut)} .calc .note b{color:var(--mint)}

/* packages */
.pkgs{display:grid;gap:12px;margin-top:14px}
.pkg{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;position:relative}
.pkg.hot{border-color:var(--mint);background:linear-gradient(180deg,rgba(94,214,164,.12),rgba(94,214,164,.03))}
.pkg .tag{position:absolute;top:-11px;right:14px;background:var(--mint);color:var(--ink);font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px}
.pkg h3{font-size:17px;margin-bottom:4px}
.pkg .for{font-size:13.5px;color:var(--mut);margin-bottom:10px}
.pkg .big{font-size:24px;font-weight:800;letter-spacing:-.01em;line-height:1.2} .pkg .big small{font-size:13px;font-weight:600;color:var(--mut)}
.pkg ul{margin:10px 0 0;padding:0;list-style:none}
.pkg li{padding:4px 0 4px 24px;position:relative;font-size:14px;color:var(--mut)}
.pkg li::before{content:"";position:absolute;left:2px;top:10px;width:12px;height:7px;border-left:2.5px solid var(--mint);border-bottom:2.5px solid var(--mint);transform:rotate(-45deg)}
.pkg .lim{font-size:12.5px;color:var(--dim);margin-top:8px;font-style:italic}
.free{background:rgba(94,214,164,.10);border:1px dashed rgba(94,214,164,.5);border-radius:14px;padding:12px 14px;font-size:14px;margin-top:14px}
.free b{color:var(--mint)}

/* steps / tiles */
.steps{margin-top:14px;display:grid;gap:10px}
.step{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.step .n{width:30px;height:30px;border-radius:50%;border:2px solid var(--mint);color:var(--mint);display:grid;place-items:center;font-weight:800;flex:none}
.step h3{font-size:15px;margin-bottom:2px}.step p{font-size:14px;color:var(--mut)}

/* faq */
.faq{margin-top:14px;display:grid;gap:8px}
.faq details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px}
.faq summary{list-style:none;cursor:pointer;padding:13px 0;font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--mint);font-size:20px;font-weight:800}
.faq details[open] summary::after{content:"–"}
.faq .a{padding:0 0 14px;font-size:14.5px;color:var(--mut)}

.about{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:14px}
.about .av{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#2E457A,#1B2A4A);display:grid;place-items:center;flex:none;border:1px solid var(--line);font-weight:800;font-size:20px}
.about p{font-size:14px;color:var(--mut)}

/* form */
.form{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px}
.f{margin-bottom:12px} .f label{display:block;font-size:13px;color:var(--mut);margin-bottom:6px;font-weight:600}
.f input,.f textarea{width:100%;background:#0B1426;border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:12px 13px;font:inherit;font-size:16px;outline:none}
.f input:focus,.f textarea:focus{border-color:var(--mint)} .f textarea{min-height:70px;resize:vertical}
.pill{display:inline-block;background:rgba(94,214,164,.12);border:1px solid rgba(94,214,164,.35);color:var(--tx);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600}
.err{color:var(--red);font-size:13px;margin-top:4px;display:none}
.ok{display:none;text-align:center;padding:22px 10px} .ok .big{font-size:48px} .ok h3{font-size:20px;margin:8px 0 6px}

.cta{position:fixed;left:0;right:0;bottom:0;padding:12px var(--pad) calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(15,27,51,0),rgba(15,27,51,.92) 35%);z-index:10}
.cta .btn{max-width:560px;margin:0 auto}
.cta.hide{display:none}
.foot{text-align:center;color:var(--dim);font-size:12px;padding:26px 0 10px}
.reveal{opacity:0;transform:translateY(14px);transition:.5s ease} .reveal.in{opacity:1;transform:none}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand"><div class="mark">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="13" rx="4" stroke="#fff" stroke-width="2"/><path d="M8 17v4l4-4" fill="#fff"/><path d="M8 10.5l2.5 2.5L16 8" stroke="#5ED6A4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div><span data-i="brand"></span></div>
    <div class="lang"><button data-l="ru">RU</button><button data-l="es">ES</button></div>
  </div>

  <!-- HERO -->
  <section class="hero">
    <span class="badge"><i class="dot"></i><span data-i="badge"></span></span>
    <h1 data-i="h1"></h1>
    <p class="sub" data-i="h1sub"></p>
    <div class="hero-chat">
      <div class="t"><span data-i="hc_who"></span><span>23:40</span></div>
      <div class="bub out" data-i="hc_1"></div>
      <div class="bub in" data-i="hc_2"></div>
      <div class="bub in" data-i="hc_3"></div>
      <div class="seen" data-i="hc_seen"></div>
    </div>
    <button class="btn" id="heroBtn" data-i="hero_btn"></button>
  </section>

  <!-- QUIZ -->
  <section class="sec" id="quiz">
    <span class="eyebrow" data-i="q_eb"></span>
    <h2 data-i="q_h"></h2>
    <p class="sub" data-i="q_sub"></p>
    <div class="quiz" id="quizBox">
      <div class="prog"><i id="prog"></i></div>
      <div class="qn" id="qn"></div>
      <h3 id="qTitle"></h3>
      <div class="opts" id="qOpts"></div>
      <div class="qnav"><button class="btn ghost sm back" id="qBack">←</button><button class="btn sm hidden" id="qNext" data-i="q_next"></button></div>
    </div>
    <!-- RESULT -->
    <div class="result hidden" id="resultBox">
      <span class="eyebrow" data-i="r_eb"></span>
      <h2 data-i="r_h"></h2>
      <div class="meta" id="rMeta"></div>
      <div class="txt" id="rText"></div>
      <b data-i="r_can"></b>
      <ol id="rMods"></ol>
      <p class="mut" style="font-size:14px" data-i="r_you"></p>
      <div class="loss" id="rLoss" style="margin-top:12px"></div>
      <h3 style="margin-top:16px;font-size:17px" data-i="r_next"></h3>
      <div class="three">
        <button class="btn" data-go="#demo" data-i="b_example"></button>
        <button class="btn ghost" data-go="#calc" data-i="b_calc"></button>
        <button class="btn ghost" data-go="#lead" data-i="b_human"></button>
      </div>
      <button class="btn ghost sm" id="qRedo" data-i="q_redo"></button>
    </div>
  </section>

  <!-- DEMO -->
  <section class="sec reveal" id="demo">
    <span class="eyebrow" data-i="d_eb"></span>
    <h2 data-i="d_h"></h2>
    <p class="sub" data-i="d_sub"></p>
    <div class="chips" id="nicheChips" style="margin-top:12px"></div>
    <div class="phone">
      <div class="ph-top"><div class="av">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="13" rx="4" stroke="#fff" stroke-width="2"/><path d="M8 10.5l2.5 2.5L16 8" stroke="#5ED6A4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div><div><div class="nm" id="phName"></div><div class="st" data-i="ph_online"></div></div></div>
      <div class="ph-body" id="phBody"></div>
      <div class="ph-foot"><div class="inp" data-i="ph_inp"></div></div>
    </div>
    <div class="owner-note" id="ownerNote"></div>
    <button class="btn ghost sm" id="restart" data-i="d_restart"></button>
    <button class="btn sm" data-go="#calc" data-i="b_calc"></button>
  </section>

  <!-- CALC -->
  <section class="sec reveal" id="calc">
    <span class="eyebrow" data-i="c_eb"></span>
    <h2 data-i="c_h"></h2>
    <p class="sub" data-i="c_sub"></p>
    <div class="calc">
      <div class="cur"><button data-c="ARS" class="on">ARS</button><button data-c="USD">USD</button></div>
      <div class="row"><div class="lab"><span data-i="c_check"></span><b id="vCheck"></b></div><input type="range" id="rCheck" min="0" max="100" value="25"></div>
      <div class="row"><div class="lab"><span data-i="c_missed"></span><b id="vMissed"></b></div><input type="range" id="rMissed" min="0" max="20" value="3"></div>
      <div class="row"><div class="lab"><span data-i="c_noshow"></span><b id="vNoshow"></b></div><input type="range" id="rNoshow" min="0" max="20" value="4"></div>
      <div class="res">
        <div class="box"><div class="k" data-i="c_month"></div><div class="v red" id="lossM"></div></div>
        <div class="box"><div class="k" data-i="c_year"></div><div class="v red" id="lossY"></div></div>
      </div>
      <p class="note" id="cNote"></p>
    </div>
  </section>

  <!-- PACKAGES -->
  <section class="sec reveal" id="prices">
    <span class="eyebrow" data-i="pr_eb"></span>
    <h2 data-i="pr_h"></h2>
    <p class="sub" data-i="pr_sub"></p>
    <div class="free" id="freeBox"></div>
    <div class="pkgs" id="pkgs"></div>
    <p class="mut" style="font-size:13.5px;margin-top:12px" data-i="pr_add"></p>
  </section>

  <!-- HOW -->
  <section class="sec reveal">
    <span class="eyebrow" data-i="s_eb"></span>
    <h2 data-i="s_h"></h2>
    <div class="steps">
      <div class="step"><div class="n">1</div><div><h3 data-i="s1h"></h3><p data-i="s1p"></p></div></div>
      <div class="step"><div class="n">2</div><div><h3 data-i="s2h"></h3><p data-i="s2p"></p></div></div>
      <div class="step"><div class="n">3</div><div><h3 data-i="s3h"></h3><p data-i="s3p"></p></div></div>
    </div>
  </section>

  <!-- FAQ / objections -->
  <section class="sec reveal" id="faq">
    <span class="eyebrow" data-i="o_eb"></span>
    <h2 data-i="o_h"></h2>
    <div class="faq" id="faqBox"></div>
  </section>

  <!-- ABOUT -->
  <section class="sec reveal">
    <div class="about"><div class="av">R</div><div><h3 data-i="a_h"></h3><p data-i="a_p"></p></div></div>
  </section>

  <!-- FORM -->
  <section class="sec reveal" id="lead">
    <span class="eyebrow" data-i="f_eb"></span>
    <h2 data-i="f_h"></h2>
    <p class="sub" data-i="f_sub"></p>
    <div class="form" id="formBox">
      <div class="f"><label data-i="f_name"></label><input id="fName" autocomplete="name"></div>
      <div class="f"><label data-i="f_niche"></label><span class="pill" id="fNiche"></span> <button class="btn ghost sm" style="display:inline-block;width:auto;margin:0 0 0 6px;padding:6px 10px;font-size:13px" data-go="#quiz" data-i="f_change"></button></div>
      <div class="f"><label data-i="f_contact"></label><input id="fContact" placeholder="@username / +54 9 11…"></div>
      <div class="f"><label data-i="f_when"></label><div class="chips" id="whenChips"></div></div>
      <div class="f"><label data-i="f_comment"></label><textarea id="fComment"></textarea></div>
      <div class="err" id="fErr"></div>
    </div>

const FN = {"quiz":[{"key":"niche","multi":false,"q":{"ru":"<b>1/6 · Чем занимаетесь?<\/b>","es":"<b>1/6 · ¿A qué te dedicás?<\/b>"},"opts":[["rest","🍽 Ресторан / кафе / бар","🍽 Restaurante / café / bar"],["salon","💅 Салон / барбершоп","💅 Salón / barbería"],["clinic","🦷 Клиника / стоматология","🦷 Clínica / dentista"],["realty","🏠 Недвижимость","🏠 Inmobiliaria"],["fit","🏋️ Фитнес / студия","🏋️ Fitness / estudio"],["hotel","🏨 Отель / апартаменты","🏨 Hotel / departamentos"],["auto","🚗 Автосервис","🚗 Taller mecánico"],["shop","🛍 Магазин","🛍 Tienda"],["edu","🎓 Курсы / консультации","🎓 Cursos / consultoría"],["other","✨ Другое","✨ Otro"]]},{"key":"channel","multi":false,"q":{"ru":"<b>2/6 · Где вам сейчас пишут клиенты?<\/b>","es":"<b>2/6 · ¿Por dónde te escriben hoy los clientes?<\/b>"},"opts":[["wa","WhatsApp","WhatsApp"],["ig","Instagram Direct","Instagram Direct"],["tg","Telegram","Telegram"],["phone","Звонят","Llaman"],["mix","Везде понемногу","Un poco de todo"]]},{"key":"volume","multi":false,"q":{"ru":"<b>3/6 · Сколько обращений в день?<\/b>","es":"<b>3/6 · ¿Cuántas consultas por día?<\/b>"},"opts":[["v5","До 5","Hasta 5"],["v20","5–20","5–20"],["v50","20–50","20–50"],["v50p","Больше 50","Más de 50"],["na","Не считал","No lo conté"]]},{"key":"asks","multi":true,"q":{"ru":"<b>4/6 · Что спрашивают чаще всего?<\/b>\nМожно выбрать несколько, потом «Дальше».","es":"<b>4/6 · ¿Qué te preguntan más seguido?<\/b>\nPodés elegir varias y después «Seguir»."},"opts":[["price","Цена","Precio"],["slots","Свободно ли время / места","Si hay turno / lugar"],["addr","Адрес и часы","Dirección y horarios"],["how","Как записаться / заказать","Cómo reservar / pedir"],["terms","Условия, доставка, оплата","Condiciones, envío, pago"],["own","Что-то своё","Otra cosa"]]},{"key":"reply","multi":false,"q":{"ru":"<b>5/6 · Бывает, что отвечаете не сразу?<\/b>","es":"<b>5/6 · ¿Pasa que no respondés enseguida?<\/b>"},"opts":[["self_late","Отвечаю сам, часто с задержкой","Respondo yo, muchas veces tarde"],["staff_hours","Сотрудник в рабочее время","Un empleado, en horario laboral"],["nobody_eve","Вечером и в выходные никто","De noche y fines de semana, nadie"],["fast","Всегда отвечаем быстро","Siempre respondemos rápido"]]},{"key":"booking","multi":false,"q":{"ru":"<b>6/6 · Нужна ли запись или бронирование?<\/b>","es":"<b>6/6 · ¿Necesitás turnos o reservas?<\/b>"},"opts":[["manual","Да, записываю руками","Sí, los anoto a mano"],["system","Есть система, но клиенты всё равно пишут","Tengo sistema, pero igual me escriben"],["orders","Нет, у меня заказы / заявки","No, tengo pedidos / solicitudes"],["faq","Нет, только вопросы","No, solo preguntas"]]}],"niche":{"rest":{"pkg":"pro","demo":"order","ru":{"name":"ресторан / кафе","auto":["меню с ценами","часы и адрес","бронь столика","предзаказ или доставка","акции недели","готовый заказ — вам"],"text":"Для вашего заведения бот возьмёт на себя то, о чём спрашивают чаще всего ({asks}). Клиент сможет посмотреть меню, забронировать стол на нужное время, сделать предзаказ, узнать про акции — в любое время, без ожидания ответа. Вам придёт только готовый заказ или бронь с именем и телефоном. Ничего не надо переписывать руками."},"es":{"name":"restaurante / café","auto":["menú con precios","horarios y dirección","reserva de mesa","pedido anticipado o delivery","promos de la semana","el pedido listo, para vos"],"text":"Para tu local el bot se encarga de lo que más preguntan ({asks}). El cliente puede ver el menú, reservar mesa, hacer un pedido anticipado y ver las promos, a cualquier hora, sin esperar respuesta. A vos te llega solo el pedido o la reserva lista, con nombre y teléfono. Nada que copiar a mano."}},"salon":{"pkg":"business","demo":"book","ru":{"name":"салон / барбершоп","auto":["услуги и цены","свободные окна","запись","напоминание за сутки","перенос и отмена одной кнопкой","повторная запись «как в прошлый раз»"],"text":"У вас клиенты пишут «а когда свободно?» — это самый дорогой вопрос: пока вы в работе, они ждут, а потом записываются к тому, кто ответил. Бот покажет свободные окна сам, запишет, за сутки напомнит и при отмене сразу освободит время. Вы увидите уведомление о каждой записи и список на день. Неявок станет меньше — напоминание работает лучше любого «я вам напишу»."},"es":{"name":"salón / barbería","auto":["servicios y precios","horarios libres","turno","recordatorio un día antes","cambiar o cancelar con un botón","repetir «como la última vez»"],"text":"Tus clientes escriben «¿cuándo tenés lugar?»: es la pregunta más cara. Mientras trabajás, esperan, y después reservan con quien les respondió. El bot muestra los horarios libres, anota el turno, recuerda un día antes y, si cancelan, libera el horario al instante. Vos ves cada turno y la lista del día. Menos ausencias: el recordatorio funciona mejor que cualquier «te escribo»."}},"clinic":{"pkg":"business","demo":"book","ru":{"name":"клиника / стоматология","auto":["услуги и ориентировочные цены","запись к врачу","памятка «как подготовиться»","напоминание за сутки и за 2 часа","напоминание о плановом визите","FAQ по страховке и оплате"],"text":"У клиники два дорогих провала: пациент не записался, потому что не дождался ответа, и пациент не пришёл, потому что забыл. Бот закрывает оба: записывает сам, напоминает дважды, а через полгода напоминает о плановом осмотре. Администратор видит расписание и получает только подтверждённые записи."},"es":{"name":"clínica / dentista","auto":["servicios y precios orientativos","turno con el profesional","instructivo «cómo prepararse»","recordatorio un día y 2 horas antes","aviso de control semestral","FAQ de obra social y pago"],"text":"Una clínica pierde plata en dos lugares: el paciente que no sacó turno porque nadie le respondió, y el que no vino porque se olvidó. El bot cierra los dos: anota solo, recuerda dos veces y a los seis meses avisa el control. La recepción ve la agenda y recibe solo turnos confirmados."}},"realty":{"pkg":"pro","demo":"qualify","ru":{"name":"недвижимость","auto":["сбор требований: аренда/покупка, район, бюджет, комнаты, срок","квалификация","карточка горячего лида агенту","подписка на новые объекты"],"text":"Агенту не нужно вести десять одинаковых диалогов. Бот спросит район, бюджет, количество комнат и срок — и передаст вам карточку клиента, где всё уже заполнено. Вы отвечаете только тем, у кого совпал бюджет с районом. Остальным бот вежливо предложит подписаться на новые объекты."},"es":{"name":"inmobiliaria","auto":["requisitos: alquiler/compra, zona, presupuesto, ambientes, plazo","calificación","ficha del lead caliente al agente","suscripción a propiedades nuevas"],"text":"El agente no tiene que llevar diez charlas iguales. El bot pregunta zona, presupuesto, ambientes y plazo, y te pasa la ficha del cliente ya completa. Respondés solo a los que tienen presupuesto para esa zona. Al resto el bot les ofrece suscribirse a propiedades nuevas."}},"fit":{"pkg":"business","demo":"book","ru":{"name":"фитнес / студия","auto":["расписание групп","пробное занятие","абонементы и оплата","напоминание о занятии","напоминание об окончании абонемента","лист ожидания в полные группы"],"text":"Три вещи, на которых студия теряет деньги: не пришёл на пробное, забыл продлить абонемент, не узнал, что в группе освободилось место. Бот записывает на пробное и напоминает, за три дня до конца абонемента предлагает продлить, а при отмене пишет первому в листе ожидания."},"es":{"name":"fitness / estudio","auto":["horarios de las clases","clase de prueba","abonos y pago","recordatorio de la clase","aviso de vencimiento del abono","lista de espera en grupos llenos"],"text":"Tres cosas por las que un estudio pierde plata: no vino a la prueba, se olvidó de renovar, no se enteró de que se liberó un lugar. El bot anota la prueba y recuerda, tres días antes del vencimiento propone renovar y, si alguien cancela, le escribe al primero de la lista de espera."}},"hotel":{"pkg":"pro","demo":"dates","ru":{"name":"отель / апартаменты","auto":["наличие дат и цена","бронь с предоплатой","инструкция по заселению","ответы про парковку, завтрак, поздний выезд","сбор отзыва после выезда"],"text":"Гость пишет в 23:00 «есть ли свободное на выходные?» — и ждёт до утра. За это время он бронирует на Booking с их комиссией. Бот ответит сразу: даты, цена, бронь и предоплата. После заселения ответит на типовые вопросы, после выезда попросит отзыв."},"es":{"name":"hotel / departamentos","auto":["disponibilidad y precio","reserva con seña","instrucciones de check-in","respuestas sobre cochera, desayuno, late check-out","pedido de reseña al irse"],"text":"El huésped escribe a las 23:00 «¿hay lugar el fin de semana?» y espera hasta la mañana. Mientras tanto reserva por Booking, con su comisión. El bot responde al instante: fechas, precio, reserva y seña. Después del check-in contesta las dudas típicas; al irse, pide la reseña."}},"auto":{"pkg":"business","demo":"book","ru":{"name":"автосервис","auto":["запись на диагностику или ТО","ориентировочные цены по типовым работам","статус ремонта «машина готова»","напоминание о следующем ТО"],"text":"Клиент сервиса задаёт три вопроса: сколько стоит, когда можно приехать, готова ли машина. Бот отвечает на все три без участия мастера. Когда машина готова — клиент получает сообщение сам. Через полгода бот напомнит про ТО, и клиент вернётся к вам, а не к первому попавшемуся."},"es":{"name":"taller mecánico","auto":["turno para diagnóstico o service","precios orientativos de trabajos típicos","estado del arreglo: «el auto está listo»","aviso del próximo service"],"text":"El cliente del taller pregunta tres cosas: cuánto sale, cuándo puede ir, si el auto está listo. El bot responde las tres sin molestar al mecánico. Cuando el auto está listo, el cliente recibe el aviso solo. A los seis meses el bot recuerda el service, y el cliente vuelve a vos, no al primero que encuentra."}},"shop":{"pkg":"basic","demo":"order","ru":{"name":"магазин","auto":["каталог и цены","наличие","заказ с доставкой или самовывозом","условия оплаты","передача заказа вам"],"text":"Половина сообщений в магазин — «есть в наличии?» и «сколько стоит?». Бот отвечает на них сам, принимает заказ с адресом и способом оплаты и передаёт вам готовую заявку. Вы собираете заказ, а не переписку."},"es":{"name":"tienda","auto":["catálogo y precios","stock","pedido con envío o retiro","formas de pago","el pedido, a vos"],"text":"La mitad de los mensajes a una tienda son «¿hay stock?» y «¿cuánto sale?». El bot los responde solo, toma el pedido con dirección y forma de pago y te lo pasa listo. Vos armás el pedido, no la charla."}},"edu":{"pkg":"basic","demo":"book","ru":{"name":"курсы / консультации","auto":["программа и цены","запись на пробное или консультацию","напоминание о занятии","ответы на типовые вопросы","заявка с контактом — вам"],"text":"Тот, кто спросил «сколько стоит и когда старт», решает в тот же вечер. Если ответ пришёл утром — он уже выбрал других. Бот отвечает сразу, записывает на пробное и напоминает о нём. Вам приходит заявка с именем и контактом, а не «здравствуйте» в директе."},"es":{"name":"cursos / consultoría","auto":["programa y precios","inscripción a la clase de prueba o consulta","recordatorio","respuestas a las dudas típicas","la solicitud con contacto, a vos"],"text":"El que pregunta «cuánto sale y cuándo empieza» decide esa misma noche. Si la respuesta llega a la mañana, ya eligió a otro. El bot responde al instante, anota la prueba y la recuerda. A vos te llega la solicitud con nombre y contacto, no un «hola» en el direct."}},"other":{"pkg":"basic","demo":"qualify","ru":{"name":"ваш бизнес","auto":["ответы на типовые вопросы","цены и условия","сбор заявки с квалификацией","передача вам"],"text":"Даже если ниша особенная, схема одна: бот отвечает на повторяющиеся вопросы, задаёт клиенту два-три уточнения и передаёт вам готовую заявку. Вы отвечаете только тем, кто уже решил."},"es":{"name":"tu negocio","auto":["respuestas a las dudas de siempre","precios y condiciones","solicitud calificada","derivación a vos"],"text":"Aunque el rubro sea particular, el esquema es el mismo: el bot responde lo repetitivo, le hace al cliente dos o tres preguntas y te pasa la solicitud lista. Respondés solo a los que ya decidieron."}}},"ask_module":{"ru":{"price":"узнать цены","slots":"увидеть свободное время или места","addr":"посмотреть адрес и часы","how":"записаться или заказать без переписки","terms":"узнать условия, доставку и оплату","own":"получить ответ на ваш частый вопрос"},"es":{"price":"ver los precios","slots":"ver horarios o lugares libres","addr":"ver dirección y horarios","how":"reservar o pedir sin chatear","terms":"ver condiciones, envío y pago","own":"resolver tu pregunta frecuente"}},"main_module":{"ru":{"manual":"записаться на свободное время","system":"записаться, не отвлекая вас","orders":"оформить заказ","faq":"оставить заявку"},"es":{"manual":"sacar turno en un horario libre","system":"sacar turno sin molestarte","orders":"hacer el pedido","faq":"dejar una solicitud"}},"volume_mid":{"v5":3,"v20":12,"v50":35,"v50p":60,"na":null},"unanswered_share":{"self_late":0.3,"staff_hours":0.35,"nobody_eve":0.35,"fast":0.1},"packages":{"basic":{"ru":{"name":"Basic — «ответы и заявки»","for":"мастера-одиночки, консультанты, небольшие магазины — все, у кого в основном вопросы","in":["FAQ до 15 ответов, цены, адрес и часы","форма заявки с передачей вам в Telegram","один язык"],"limits":"без записи на время, без напоминаний, без интеграций"},"es":{"name":"Basic — «respuestas y solicitudes»","for":"profesionales independientes, consultores, tiendas chicas: donde son sobre todo preguntas","in":["FAQ hasta 15 respuestas, precios, dirección y horarios","formulario de solicitud que te llega a Telegram","un idioma"],"limits":"sin turnos por horario, sin recordatorios, sin integraciones"}},"business":{"ru":{"name":"Business — «запись и напоминания»","for":"салоны, барбершопы, клиники, фитнес, автосервисы — все, кто живёт по расписанию","in":["всё из делю, а дальше решите сами.","es":"Puede ser. Una sola pregunta: ¿cuántas personas te escribieron la semana pasada y no reservaron? Si sabés el número, de verdad no lo necesitás. Si no lo sabés, el bot te lo muestra en una semana y después decidís."},"whatsapp":{"ru":"WhatsApp — это где вам пишут. Бот — это кто отвечает, когда вы не можете. Он не заменяет WhatsApp, а закрывает время, пока вы в работе. Бота можно поставить и в WhatsApp — Telegram просто быстрее и дешевле для старта.","es":"WhatsApp es por dónde te escriben. El bot es quién responde cuando vos no podés. No reemplaza WhatsApp: cubre el tiempo en que estás trabajando. El bot también va en WhatsApp; Telegram es más rápido y barato para arrancar."},"site":{"ru":"Сайт показывает. Бот делает: записывает, напоминает, передаёт вам готовую заявку. Посмотрите, сколько людей с сайта всё равно пишут вам в директ «а как записаться» — это и есть работа, которую забирает бот.","es":"El sitio muestra. El bot hace: anota, recuerda, te pasa la solicitud lista. Fijate cuántos, después de ver el sitio, igual te escriben «¿cómo reservo?»: ese es el trabajo que se lleva el bot."},"staff":{"ru":"И правильно. Вопрос — что они делают в 22:00 и в воскресенье. Бот не заменяет сотрудника: он отвечает, пока сотрудника нет, и передаёт ему утром готовые записи, а не переписку с двадцатью «здравствуйте».","es":"Y está bien. La pregunta es qué hacen a las 22:00 y el domingo. El bot no reemplaza al empleado: responde cuando no está y a la mañana le pasa turnos listos, no veinte charlas que empiezan con «hola»."},"notg":{"ru":"В Буэнос-Айресе — да, там WhatsApp. Поэтому для местных клиентов ставим бота в WhatsApp, для русскоязычных — в Telegram; логика одна, делаю обе. А ссылка на запись работает откуда угодно: из Instagram, с сайта, из QR-кода на стойке.","es":"En Buenos Aires, sí: acá es WhatsApp. Por eso para clientes locales el bot va en WhatsApp y para rusoparlantes en Telegram; la lógica es la misma, hago las dos. Y el link de re const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const fmtN=n=>new Intl.NumberFormat(lang==="ru"?"ru-RU":"es-AR").format(Math.round(n));
const fill=(s,o)=>s.replace(/\{(\w+)\}/g,(_,k)=>o[k]??"");
function haptic(k){ try{ if(!tg) return; if(k==="success") tg.HapticFeedback.notificationOccurred("success"); else tg.HapticFeedback.impactOccurred(k);}catch(e){} }
function go(sel){ const el=$(sel); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); }

function readParams(){
  try{
    const q=new URLSearchParams(location.search).get("q"); if(!q) return;
    const s=q.replace(/-/g,"+").replace(/_/g,"/"); const raw=atob(s+"===".slice((s.length+3)%4));
    const o=JSON.parse(decodeURIComponent(escape(raw)));
    if(o.lang) lang=o.lang; if(o.quiz&&o.quiz.niche){ quiz=o.quiz; quizDone=true; niche=quiz.niche; }
    prefill={name:o.name||"", username:o.username||""};
  }catch(e){}
}
function detectLang(){
  const lc=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.language_code;
  if(lc) return lc.startsWith("ru")?"ru":"es";
  return (navigator.language||"").startsWith("ru")?"ru":"es";
}
const lbl=(key,code)=>{ const q=FN.quiz.find(x=>x.key===key); const o=q&&q.opts.find(x=>x[0]===code); if(!o) return ""; const s=lang==="ru"?o[1]:o[2]; return key==="niche"?s.replace(/^\S+\s/,""):s; };

/* ========== RENDER ========== */
function render(){
  const t=T[lang]; document.documentElement.lang=lang;
  $$("[data-i]").forEach(el=>{ const k=el.dataset.i; if(typeof t[k]==="string") el.innerHTML=t[k]; });
  $$(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));
  renderQuiz(); renderNiches(); renderPkgs(); renderFaq();
  const wc=$("#whenChips"); wc.innerHTML="";
  t.when.forEach((w,i)=>{ const b=document.createElement("button"); b.textContent=w; b.className=when===i?"on":""; b.onclick=()=>{when=i;haptic("light");render();}; wc.appendChild(b); });
  $("#fNiche").textContent = niche ? lbl("niche",niche) : "—";
  if(tg) tg.MainButton.setText(t.cta_main);
  calc();
}

/* ========== QUIZ ========== */
function renderQuiz(){
  const t=T[lang];
  if(quizDone){ $("#quizBox").classList.add("hidden"); $("#resultBox").classList.remove("hidden"); renderResult(); return; }
  $("#quizBox").classList.remove("hidden"); $("#resultBox").classList.add("hidden");
  const q=FN.quiz[qIdx]; $("#prog").style.width=(qIdx/FN.quiz.length*100)+"%";
  $("#qn").textContent=`${qIdx+1} / ${FN.quiz.length}`;
  $("#qTitle").innerHTML=q.q[lang].replace(/<\/?b>/g,"").split("\n")[0].replace(/^\d\/\d · /,"");
  const box=$("#qOpts"); box.innerHTML=""; box.className="opts"+(q.key==="niche"?" two":"");
  q.opts.forEach(([code,ru,es])=>{
    const b=document.createElement("button"); b.className="opt"; b.textContent=lang==="ru"?ru:es;
    const sel=q.multi ? (quiz[q.key]||[]).includes(code) : quiz[q.key]===code;
    if(sel) b.classList.add("on");
    b.onclick=()=>{ haptic("light");
      if(q.multi){ const a=new Set(quiz[q.key]||[]); a.has(code)?a.delete(code):a.add(code); quiz[q.key]=[...a]; renderQuiz(); }
      else { quiz[q.key]=code; if(q.key==="niche") niche=code; setTimeout(nextQ,180); }
    };
    box.appendChild(b);
  });
  $("#qNext").classList.toggle("hidden",!q.multi);
  $("#qBack").style.visibility=qIdx?"visible":"hidden";
}
function nextQ(){
  const q=FN.quiz[qIdx];
  if(q.multi && !(quiz[q.key]||[]).length){ alert(T[lang].q_pick); return; }
  if(qIdx+1<FN.quiz.length){ qIdx++; renderQuiz(); }
  else { quizDone=true; haptic("success"); render(); startDemo(); setTimeout(()=>go("#resultBox"),50); }
}
function lossEstimate(a){
  const daily=FN.volume_mid[a.volume]; if(!daily) return [null,null];
  const share=FN.unanswered_share[a.reply]??0.3; const un=Math.round(daily*share*6); return [un,Math.max(1,Math.round(un*0.3))];
}
function renderResult(){
  const t=T[lang], a=quiz, n=FN.niche[a.niche||"other"], L=n[lang];
  const asks=(a.asks||[]).filter(c=>FN.ask_module[lang][c]).slice(0,3);
  const asksLbl=asks.map(c=>lbl("asks",c)).join(", ").toLowerCase() || (lang==="ru"?"цена и условия":"precio y condiciones");
  $("#rMeta").textContent=fill(t.r_meta,{niche:L.name,channel:lbl("channel",a.channel),volume:lbl("volume",a.volume).toLowerCase(),asks:asksLbl});
  $("#rText").textContent=fill(L.text,{asks:asksLbl});
  const mods=asks.map(c=>FN.ask_module[lang][c]); const main=FN.main_module[lang][a.booking||"faq"]; if(!mods.includes(main)) mods.push(main); mods.push(t.remind);
  $("#rMods").innerHTML=mods.map(m=>`<li>${m}</li>`).join("");
  const [un,lost]=lossEstimate(a);
  $("#rLoss").innerHTML= un ? fill(t.r_loss,{unans:un,lost}) : t.r_loss_na;
}

/* ========== NICHES + DEMO ========== */
function renderNiches(){
  const box=$("#nicheChips"); box.innerHTML="";
  const q=FN.quiz[0];
  q.opts.forEach(([code,ru,es])=>{ const b=document.createElement("button"); b.textContent=lang==="ru"?ru:es; b.className=code===(niche||"salon")?"on":"";
    b.onclick=()=>{ niche=code; haptic("light"); renderNiches(); startDemo(); }; box.appendChild(b); });
  const biz=FN.demo_biz[niche||"salon"][lang][0];
  $("#phName").textContent=biz.replace(/^(студии красоты|студии|барбершопа|детской студии|школы|клиники|агентства|сервиса|магазина|апартаментов|кафе|кухня|вашего)\s*/,"").replace(/^«|»$/g,"");
}
let demoTimer=[];
function clearDemo(){ demoTimer.forEach(clearTimeout); demoTimer=[]; $("#phBody").innerHTML=""; $("#ownerNote").style.display="none"; }
function wait(ms){ return new Promise(r=>demoTimer.push(setTimeout(r,ms))); }
function scrollPh(){ const b=$("#phBody"); b.scrollTop=b.scrollHeight; }
const strip=s=>s.replace(/<\/?b>/g,"");
async function botSay(text){
  const b=$("#phBody"); const ty=document.createElement("div"); ty.className="typing"; ty.innerHTML="<i></i><i></i><i></i>"; b.appendChild(ty); scrollPh();
  await wait(650); ty.remove();
  const d=document.createElement("div"); d.className="bub in"; d.textContent=strip(text); b.appendChild(d); scrollPh(); await wait(120);
}
function userSay(text){ const d=document.createElement("div"); d.className="bub out"; d.textContent=text; $("#phBody").appendChild(d); scrollPh(); }
function ask(options){
  return new Promise(res=>{
    const kb=document.createElement("div"); kb.className="kb";
    options.forEach(o=>{ const b=document.createElement("button"); b.textContent=o; b.onclick=()=>{ haptic("light"); kb.classList.add("done"); b.classList.add("pick"); userSay(o); res(o); }; kb.appendChild(b); });
    $("#phBody").appendChild(kb); scrollPh();
  });
}
async function startDemo(){
  clearDemo();
  const nk=niche||"salon", kind=FN.niche[nk].demo, d=FN.demo[kind][lang], [biz,items]=FN.demo_biz[nk][lang];
  await botSay(fill(d.hi,{biz})); const svc=await ask(items);
  await botSay(fill(d.day,{svc})); const day=await ask(d.days);
  await botSay(fill(d.time,{svc,day})); const time=await ask(d.times);
  await botSay(fill(d.done,{svc,day,time}));
  const n=$("#ownerNote"); n.innerHTML=fill(d.owner,{svc,day,time}); n.style.display="block";
  haptic("success");
}

/* ========== CALC ========== */
const CHECK={ ARS:{min:5000,max:120000,step:1000,def:25000}, USD:{min:5,max:150,step:5,def:25} };
function setRange(id){ const r=$(id); const p=(r.value-r.min)/(r.max-r.min)*100; r.style.setProperty("--p",p+"%"); }
function myPkg(){ return quizDone ? FN.niche[quiz.niche||"other"].pkg : "business"; }
function calc(){
  const c=CHECK[cur], r=$("#rCheck");
  r.min=c.min; r.max=c.max; r.step=c.step; if(r.dataset.cur!==cur){ r.value=c.def; r.dataset.cur=cur; }
  const check=+r.value, missed=+$("#rMissed").value, noshow=+$("#rNoshow").value;
  $("#vCheck").textContent=fmtN(check)+" "+cur; $("#vMissed").textContent=missed; $("#vNoshow").textContent=noshow;
  const m=(missed*4.3+noshow)*check;
  $("#lossM").innerHTML="−"+fmtN(m)+"<small>"+cur+"</small>"; $("#lossY").innerHTML="−"+fmtN(m*12)+"<small>"+cur+"</small>";
  ["#rCheck","#rMissed","#rNoshow"].forEach(setRange);
  $$(".cur button").forEach(b=>b.classList.toggle("on",b.dataset.c===cur));
  $("#cNote").innerHTML=fill(T[lang].c_note,{m:(PRICES[myPkg()]||{}).month_usd||40});
}
$$("#rCheck,#rMissed,#rNoshow").forEach(r=>r.addEventListener("input",calc));
$$(".cur button").forEach(b=>b.onclick=()=>{cur=b.dataset.c;haptic("light");calc();});

/* ========== PACKAGES ========== */
function renderPkgs(){
  const t=T[lang], mine=quizDone?myPkg():null;
  const order=mine?[mine,...FN.pkg_order.filter(p=>p!==mine)]:FN.pkg_order;
  $("#freeBox").innerHTML= FREE>0 ? fill(t.pr_free,{n:FREE}) : ""; $("#freeBox").style.display=FREE>0?"block":"none";
  $("#pkgs").innerHTML=order.map((p,i)=>{ const P=FN.packages[p][lang], pr=PRICES[p]||{};
    const price = pr.setup_usd ? `${pr.from?t.pr_from:""}${pr.setup_usd} USD <small>${t.pr_setup}</small><br>+ ${pr.month_usd} USD <small>${t.pr_month}</small>` : "";
    return `<div class="pkg${mine&&i===0?" hot":""}">${mine&&i===0?`<span class="tag">${t.pr_tag}</span>`:""}<h3>${P.name}</h3><div class="for">${t.pr_for}${P.for}</div><div class="big">${price}</div><ul>${P.in.map(x=>`<li>${x}</li>`).join("")}</ul><div class="lim">${P.limits}</div></div>`; }).join("");
}

/* ========== FAQ ========== */
function renderFaq(){
  const t=T[lang];
  $("#faqBox").innerHTML=Object.keys(FN.objections).map(k=>`<details><summary>${t.obj_titles[k]}</summary><div class="a">${FN.objections[k][lang]}</div></details>`).join("");
}

/* ========== FORM / SUBMIT ========== */
function validate(){
  const t=T[lang], name=$("#fName").value.trim(), contact=$("#fContact").value.trim(), err=$("#fErr");
  const show=(msg,el)=>{ err.textContent=msg; err.style.display="block"; if(el) el.focus(); return null; };
  if(!quizDone){ go("#quiz"); return show(t.err_quiz); }
  if(!name) return show(t.err_name,$("#fName"));
  if(!contact) return show(t.err_contact,$("#fContact"));
  err.style.display="none";
  const r=$("#rCheck");
  return { type:"lead", lang, name, contact, when: when===null?"":t.when[when], comment:$("#fComment").value.trim(),
    niche_label: lbl("niche",niche), quiz, human:true,
    calc:{cur, check:+r.value, missed:+$("#rMissed").value, noshow:+$("#rNoshow").value, loss_month:Math.round((+$("#rMissed").value*4.3 + +$("#rNoshow").value)*+r.value)} };
}
function submit(){
  const data=validate(); if(!data){ if(quizDone) go("#lead"); return; }
  haptic("success");
  if(tg&&tg.sendData){ try{ tg.sendData(JSON.stringify(data)); return; }catch(e){} }
  $("#formBox").style.display="none"; const ok=$("#okBox"); ok.style.display="block";
  ok.querySelector("p").innerHTML=T[lang].fallback+`<a href="https://t.me/${CONTACT.replace("@","")}">${CONTACT}</a>`;
  $("#cta").classList.add("hide");
}

/* ========== INIT ========== */
(function init(){
  lang=detectLang(); readParams();
  if(tg){
    tg.ready(); tg.expand();
    try{ tg.setHeaderColor("#0F1B33"); tg.setBackgroundColor("#0F1B33"); }catch(e){}
    tg.MainButton.setParams({color:"#5ED6A4",text_color:"#0F1B33",is_visible:true,is_active:true});
    tg.MainButton.onClick(submit);
    $("#cta").classList.add("hide");
    const u=tg.initDataUnsafe&&tg.initDataUnsafe.user;
    if(u){ prefill.name=prefill.name||[u.first_name,u.last_name].filter(Boolean).join(" "); prefill.username=prefill.username||u.username||""; }
  } else {
    $("#ctaBtn").onclick=submit;
  }
  if(prefill.name) $("#fName").value=prefill.name;
  if(prefill.username) $("#fContact").value="@"+prefill.username;
  $$(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;haptic("light");render();startDemo();});
  $("#restart").onclick=()=>{haptic("light");startDemo();};
  $("#heroBtn").onclick=()=>go("#quiz");
  $("#qNext").onclick=nextQ;
  $("#qBack").onclick=()=>{ if(qIdx){ qIdx--; renderQuiz(); } };
  $("#qRedo").onclick=()=>{ quizDone=false; qIdx=0; render(); go("#quiz"); };
  $$("[data-go]").forEach(b=>b.addEventListener("click",()=>{haptic("light");go(b.dataset.go);}));
  render(); startDemo();
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}}),{threshold:.08});
  $$(".reveal").forEach(el=>io.observe(el));
})();
</script>
</body>
</html>
